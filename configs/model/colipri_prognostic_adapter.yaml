  - {name: adapter_supervised, kind: adapter, reconstruction_weight: 0.0, anchor_weight: 0.0, prognosis_weight: 1.0}
  - {name: adapter_joint_p01, kind: adapter, reconstruction_weight: 1.0, anchor_weight: 0.1, prognosis_weight: 0.1}
